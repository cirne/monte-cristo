<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Monte Cristo Companion — Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 16px;
        min-width: 340px;
        color: #1c1917;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid #d6d3d1;
        border-radius: 6px;
      }
      button {
        margin-top: 10px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        color: #fef3c7;
        background: #b45309;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #status {
        margin-left: 8px;
        font-size: 12px;
        color: #16a34a;
      }
    </style>
  </head>
  <body>
    <label for="baseUrl">Companion reader base URL</label>
    <input id="baseUrl" type="url" placeholder="http://localhost:3000" />
    <button id="save">Save</button><span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
